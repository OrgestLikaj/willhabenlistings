name: willhaben scraper

on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07 (off-peak minutes are more reliable)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          WILLHABEN_URL: ${{ vars.WILLHABEN_URL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python scraper.py

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json state.json
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "update state [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((RANDOM % 5 + 2))
          done
          echo "could not push after 5 attempts"
          exit 1
